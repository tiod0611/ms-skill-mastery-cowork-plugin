<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{SKILL_NAME}} 학습 로드맵</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-3: #059669;
    --line: #e2e8f0;
    --beginner: #059669;
    --intermediate: #2563eb;
    --advanced: #7c3aed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Pretendard", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 320px, #f1f5f9 320px, #f1f5f9 100%);
    color: var(--ink);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header.hero {
    text-align: center;
    color: #fff;
    padding: 24px 12px 40px;
  }

  .badge-eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #cbd5e1;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  header.hero h1 {
    font-size: 40px;
    margin: 0 0 12px;
    font-weight: 800;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header.hero p.summary {
    max-width: 640px;
    margin: 0 auto;
    color: #cbd5e1;
    font-size: 16px;
    line-height: 1.6;
  }

  header.hero .meta {
    margin-top: 22px;
    font-size: 13px;
    color: #cbd5e1;
  }

  /* Timeline */
  .timeline {
    position: relative;
    margin-top: 24px;
  }

  .timeline::before {
    content: "";
    position: absolute;
    left: 27px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    background: linear-gradient(180deg, var(--beginner), var(--intermediate), var(--advanced));
    border-radius: 3px;
  }

  /* ============================================================
     STAGE BLOCK — duplicate the <section class="stage">...</section>
     element below once per roadmap stage (Beginner / Intermediate /
     Advanced / ...). Replace the placeholder tokens inside each copy:
       {{STAGE_INDEX}}        -> 1, 2, 3, ... (stage order number)
       {{STAGE_LEVEL_CLASS}}  -> "beginner" | "intermediate" | "advanced"
       {{STAGE_TITLE}}        -> e.g. "Beginner"
       {{STAGE_TIME}}         -> e.g. "2-3 weeks"
       {{STAGE_TOPICS}}       -> concatenated <li class="topic">...</li>
                                  blocks, see TOPIC BLOCK below
     ============================================================ */
  .stage {
    position: relative;
    padding-left: 64px;
    margin-bottom: 32px;
  }

  .stage-dot {
    position: absolute;
    left: 12px;
    top: 4px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    border: 4px solid #f1f5f9;
    box-shadow: 0 0 0 2px var(--line);
  }

  .stage.beginner .stage-dot { background: var(--beginner); }
  .stage.intermediate .stage-dot { background: var(--intermediate); }
  .stage.advanced .stage-dot { background: var(--advanced); }

  .stage-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.05);
  }

  .stage-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stage-card-head h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
  }

  .time-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .stage.beginner .time-badge { background: #ecfdf5; color: var(--beginner); }
  .stage.intermediate .time-badge { background: #eff6ff; color: var(--intermediate); }
  .stage.advanced .time-badge { background: #f5f3ff; color: var(--advanced); }

  ul.topics {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 14px;
  }

  /* ============================================================
     TOPIC BLOCK — duplicate the <li class="topic">...</li>
     element below once per topic within a stage. Replace:
       {{TOPIC_NAME}}         -> e.g. "JSX & Components"
       {{TOPIC_DESCRIPTION}}  -> 1-2 sentence description
       {{RESOURCE_URL}}       -> Microsoft Learn link (href)
       {{RESOURCE_TITLE}}     -> Link label, e.g. "Read on MS Learn"
     ============================================================ */
  li.topic {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    background: #f8fafc;
  }

  li.topic .topic-name {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
    color: var(--ink);
  }

  li.topic .topic-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  li.topic a.resource-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }

  li.topic a.resource-link:hover { text-decoration: underline; }

  li.topic a.resource-link::after {
    content: "→";
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="badge-eyebrow">학습 로드맵</span>
      <h1>{{SKILL_NAME}}</h1>
      <p class="summary">{{SUMMARY}}</p>
      <p class="meta">MS Skill Mastery 생성 &middot; {{GENERATED_DATE}}</p>
    </header>

    <div class="timeline">

      <!-- STAGE_BLOCK_START (duplicate this whole <section> per stage) -->
      <section class="stage {{STAGE_LEVEL_CLASS}}">
        <div class="stage-dot">{{STAGE_INDEX}}</div>
        <div class="stage-card">
          <div class="stage-card-head">
            <h2>{{STAGE_TITLE}}</h2>
            <span class="time-badge">⏱ {{STAGE_TIME}}</span>
          </div>
          <ul class="topics">
            {{STAGE_TOPICS}}
            <!-- TOPIC_BLOCK_START (duplicate this <li> per topic in the stage) -->
            <li class="topic">
              <div class="topic-name">{{TOPIC_NAME}}</div>
              <div class="topic-desc">{{TOPIC_DESCRIPTION}}</div>
              <a class="resource-link" href="{{RESOURCE_URL}}" target="_blank" rel="noopener">{{RESOURCE_TITLE}}</a>
            </li>
            <!-- TOPIC_BLOCK_END -->
          </ul>
        </div>
      </section>
      <!-- STAGE_BLOCK_END -->

    </div>

    <footer>
      <strong>MS Skill Mastery</strong> Cowork 플러그인으로 생성됨, powered by
      <a href="https://learn.microsoft.com/api/mcp" target="_blank" rel="noopener">Microsoft Learn MCP Server</a>.
    </footer>
  </div>
</body>
</html>
